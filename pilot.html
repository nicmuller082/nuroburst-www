<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Book a pilot — Nuroburst</title>
  <link rel="icon" href="/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="nav">
    <div class="nav-wrap nav-inner">
      <a class="brand" href="/"><img src="/logo.png" alt="Nuroburst" /></a>
      <nav class="nav-links">
        <a href="/product.html">Product</a>
        <a href="/how-it-works.html">How it works</a>
        <a href="/create.html">Create</a>
        <a href="/pricing.html">Pricing</a>
        <a href="/compare.html">Compare</a>
      </nav>
      <div class="nav-cta">
        <a class="btn btn-ghost" href="https://app.nuroburst.com">Log in</a>
        <a class="btn btn-primary" href="/pilot.html">Book a pilot</a>
      </div>
      <button class="menu-btn" id="menu" type="button">Menu</button>
    </div>
  </header>
  <div class="page-hero"><div class="wrap"><div class="kicker">Pilot</div><h1>Book a pilot.</h1><p class="muted">A working conversation. Not a checkout.</p></div></div>
  <section class="section"><div class="wrap" style="max-width:640px">
    <form id="pilot-form" class="card">
      <div><label for="name">Name</label><input id="name" name="name" required /></div>
      <div><label for="email">Work email</label><input id="email" name="email" type="email" required /></div>
      <div><label for="company">Company</label><input id="company" name="company" required /></div>
      <div><label for="size">Team size</label><select id="size" name="size"><option>1–25</option><option>26–50</option><option>51–150</option><option>151–500</option><option>500+</option></select></div>
      <div><label for="train">What you train</label><select id="train" name="train"><option>Systems</option><option>Product</option><option>Sales</option><option>Leadership</option><option>Other</option></select></div>
      <div><label for="note">Note (optional)</label><textarea id="note" name="note"></textarea></div>
      <button class="btn btn-primary" type="submit">Send to Nuroburst</button>
      <p class="muted">Opens your email to info@nuroburst.com.</p>
    </form>
  </div></section>
  <footer><div class="wrap legal">© 2026 Nuroburst</div></footer>
  <script src="/main.js"></script>
</body></html>
